services:
    customer-app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: customer_app
        env_file:
            - .env
        volumes:
            - ./:/var/www
        ports:
            - "8000:8000"
        depends_on:
            - mongo

    mongo:
        image: mongo:latest
        container_name: capoot-mongo
        restart: unless-stopped
        ports:
            - "27017:27017"
        environment:
            - MONGO_INITDB_ROOT_USERNAME=capoot
            - MONGO_INITDB_ROOT_PASSWORD=secret
            - MONGO_INITDB_DATABASE=customer_service
        volumes:
            - mongo-data:/data/db
        networks:
            - capoot-network

volumes:
    mongo-data:

networks:
    capoot-network:
        driver: bridge
